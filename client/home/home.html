<style>
/* ========== Base ========== */
.du-puzzle-wrap {

  border-radius: 14px;

  position: relative;
}

/* Left (text) and right (image) panels */
.du-left,
.du-right {
  flex: 1 1 50%;

}

/* Text content box */
.du-content {
  padding: 36px;

  justify-content: center;
  gap: 12px;
  max-width: 560px;
  z-index: 2;
}

.du-content h2 {

.du-content p {

  line-height: 1.45;

/* CTA */
.du-cta {
  display: inline-block;
  margin-top: 14px;
  padding: 10px 18px;
  border-radius: 999px;
  text-decoration: none;
  font-weight: 700;
  letter-spacing: .2px;
  box-shadow: 0 8px 18px rgba(0,0,0,0.25);
  transition: transform .22s ease, box-shadow .22s ease;
}
.du-cta:active { transform: translateY(1px); }
.du-cta:hover { transform: translateY(-4px); }

/* Image panel */
.du-right {
  background-size: cover;
  background-position: center;
  min-height: 320px;
}

/* Decorative overlay to increase contrast */
.du-right::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.22) 100%);
  pointer-events: none;
}

/* ========== Puzzle Cuts (clip-path) ========== */
/* Left panel cut (right diagonal notch) */
.cut-right {
  clip-path: polygon(0 0, 84% 0, 70% 100%, 0 100%);
}

/* Right panel alternative cut (left diagonal notch) */
.cut-left {
  clip-path: polygon(16% 0, 100% 0, 100% 100%, 30% 100%);
}

/* Slight neon glow top border */
.du-puzzle::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 4px;
  background: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.0));
  pointer-events: none;
}
