
<template name="Applayout">
  <head>
    <meta charset="UTF-8" />
    <title>QuickPharm3.0</title>
   
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.css">
      <script src="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.js"></script>
   
      <!--Let browser know website is optimized for mobile-->
       <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
       <link rel="stylesheet" href="/fontawesome/css/all.css">
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      margin: 0; padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    body {
      background: #f8f9fa;
      color: #212529;

    }
    header {
      background-color: #2a9d8f;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 2rem;
    }
    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
    }
    .hero {
      background: linear-gradient(to right, #2a9d8f, #21867a);

      color: white;
      padding: 100px 40px;
      text-align: center;
    }
    .hero h2 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }
    .hero p {
      font-size: 1.2rem;
    }
    .services {
      padding: 60px 20px;
      background: #fff;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: auto;
    }

    .service-card {
      background: #e9f5f3;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: transform 0.3s;
    }
    .service-card:hover {
      transform: translateY(-5px);
    }
    .service-card h3 {
      margin-bottom: 10px;
      color: #2a9d8f;
    }
    footer {
      background-color: #2a9d8f;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 50px;

    }
  </style>
      <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  </head>

  <body>
    
      
      
    <!--  {{> navigator}}{{> navbar}} {{> newnav}}{{> navbar2}} -->
    
    {{>newnav }}

    <div class="pusher" style="margin-top: 50px;">
  
     {{> yield}}
    </div>
    
   
  </body>
   <footer>
    <p>&copy; 2025 QuickPharm - Une solution de EGF-IT Consulting SARL</p>
  </footer> 
</template>
